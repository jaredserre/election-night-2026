name: Update NBC election results

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: election-results-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch NBC News public results
        env:
          NBC_RESULTS_URL: ${{ vars.NBC_RESULTS_URL }}
        run: node scripts/update-nbc.mjs
      - name: Commit changed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json data/timeline.json
          git diff --cached --quiet || git commit -m "Update NBC election results"
          git push
